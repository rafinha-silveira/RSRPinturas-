<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Lightbox 100% CSS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #fff;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* GRID DA GALERIA */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* --- EFEITO LIGHTBOX (MODAL ESCURO E EMBAÇADO) --- */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75); /* Escurece o fundo */
      backdrop-filter: blur(8px); /* Deixa tudo atrás embaçado */
      -webkit-backdrop-filter: blur(8px);
     
      display: flex;
      justify-content: center;
      align-items: center;
     
      /* Escondido por padrão */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }

    /* QUANDO A IMAGEM É CLICADA (MÁGICA DO CSS) */
    .lightbox:target {
      opacity: 1;
      pointer-events: auto;
    }

    /* IMAGEM EM DESTAQUE */
    .lightbox-content {
      position: relative;
      max-width: 90%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.8);
      transition: transform 0.4s ease;
    }

    .lightbox:target .lightbox-content {
      transform: scale(1); /* Animação de zoom ao abrir */
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      object-fit: contain;
    }

    /* BOTÃO DE FECHAR (X) */
    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 2rem;
      text-decoration: none;
      font-weight: bold;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #38bdf8;
    }

    /* ÁREA CLICÁVEL AO REDOR PARA FECHAR */
    .lightbox-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>

  <h1>Minha Galeria de Fotos</h1>

  <!-- GRID COM AS FOTOS DA GALERIA -->
  <div class="gallery">
    <a href="#img1" class="gallery-item">
      <img src="https://picsum.photos/800/600?random=1&quot; alt="Foto 1">
    </a>
    <a href="#img2" class="gallery-item">
      <img src="https://picsum.photos/800/600?random=2&quot; alt="Foto 2">
    </a>
    <a href="#img3" class="gallery-item">
      <img src="https://picsum.photos/800/600?random=3&quot; alt="Foto 3">
    </a>
    <a href="#img4" class="gallery-item">
      <img src="https://picsum.photos/800/600?random=4&quot; alt="Foto 4">
    </a>
  </div>

  <!-- --- ESTRUTURA DOS MODAIS (LIGHTBOX) --- -->

  <!-- Foto 1 Ampliada -->
  <div class="lightbox" id="img1">
    <a href="#" class="lightbox-overlay"></a> <!-- Clicar fora fecha -->
    <div class="lightbox-content">
      <a href="#" class="close-btn">&times;</a>
      <img src="https://picsum.photos/1200/800?random=1&quot; alt="Foto 1 Ampliada">
    </div>
  </div>

  <!-- Foto 2 Ampliada -->
  <div class="lightbox" id="img2">
    <a href="#" class="lightbox-overlay"></a>
    <div class="lightbox-content">
      <a href="#" class="close-btn">&times;</a>
      <img src="https://picsum.photos/1200/800?random=2&quot; alt="Foto 2 Ampliada">
    </div>
  </div>

  <!-- Foto 3 Ampliada -->
  <div class="lightbox" id="img3">
    <a href="#" class="lightbox-overlay"></a>
    <div class="lightbox-content">
      <a href="#" class="close-btn">&times;</a>
      <img src="https://picsum.photos/1200/800?random=3&quot; alt="Foto 3 Ampliada">
    </div>
  </div>

  <!-- Foto 4 Ampliada -->
  <div class="lightbox" id="img4">
    <a href="#" class="lightbox-overlay"></a>
    <div class="lightbox-content">
      <a href="#" class="close-btn">&times;</a>
      <img src="https://picsum.photos/1200/800?random=4&quot; alt="Foto 4 Ampliada">
    </div>
  </div>

</body>
</html>

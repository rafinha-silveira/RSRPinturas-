<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Card 3D - CSS Pure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #fff;
    }

    /* Container com perspectiva 3D */
    .card-container {
      width: 300px;
      height: 420px;
      perspective: 1000px; /* Cria a profundidade 3D */
    }

    /* Elemento interno que realmente gira */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    /* Gira a carta ao passar o mouse */
    .card-container:hover .card-inner {
      transform: rotateY(180deg);
    }

    /* Estilo compartilhado para Frente e Verso */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      -webkit-backface-visibility: hidden; /* Esconde o lado oposto ao virar */
      backface-visibility: hidden;
    }

    /* LADO DA FRENTE (Imagem) */
    .card-front {
      background-color: #1e293b;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-front-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* LADO DE TRÁS (Informações) */
    .card-back {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #38bdf8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transform: rotateY(180deg); /* Já começa invertido */
    }

    .card-back h3 {
      font-size: 1.6rem;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .card-back p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .card-back .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .card-back .btn:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card-inner">
     
      <!-- FRENTE: Apenas a Imagem com Título -->
      <div class="card-front">
        <img src="https://picsum.photos/400/600?random=10&quot; alt="Imagem da Frente">
        <div class="card-front-title">Passe o mouse</div>
      </div>

      <!-- TRÁS: Informações e Conteúdo -->
      <div class="card-back">
        <h3>Detalhes do Card</h3>
        <p>Aqui você pode colocar qualquer descrição, especificações do produto, redes sociais ou dados informativos.</p>
        <a href="#" class="btn">Saiba Mais</a>
      </div>

    </div>
  </div>

</body>
</html>
